[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # Vite 8 requires Node ^20.19.0 || >=22.12.0. Without this the site builds on
  # Netlify's legacy Node 16 default and fails on `styleText` from node:util.
  # Pinned to 24 to match the version used locally.
  NODE_VERSION = "24"

# Vite fingerprints these filenames, so their contents never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font files only ever change by getting a new name.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
