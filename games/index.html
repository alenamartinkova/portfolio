<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101018" />
    <title>Games · Alena Martinková</title>
    <meta
      name="description"
      content="A small collection of games for a little break. Start with LEGO and build something of your own."
    />
    <link rel="canonical" href="https://martinkova.dev/games/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var root = document.documentElement
        if (localStorage.getItem('theme') === 'light') root.dataset.theme = 'light'
        var accent = localStorage.getItem('accent')
        if (accent && accent !== 'violet') root.dataset.accent = accent
        var cursor = localStorage.getItem('cursor')
        if (cursor) root.dataset.cursor = cursor
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Games</h1>
      <p><a href="/lego/">LEGO · Brick break</a></p>
      <p><a href="/">Back to portfolio</a></p>
    </noscript>
    <script type="module" src="/src/games/main.jsx"></script>
  </body>
</html>
