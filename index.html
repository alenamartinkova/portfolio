    <meta name="theme-color" content="#101018" />

    <!-- Applies stored appearance choices before first paint. Dark + violet
         are the defaults and carry no attribute, so nothing is set unless the
         visitor picked something else. -->
    <script>
      try {
        var root = document.documentElement
        if (localStorage.getItem('theme') === 'light') {
          root.dataset.theme = 'light'
        }
        var accent = localStorage.getItem('accent')
        if (accent && accent !== 'violet') root.dataset.accent = accent
        var cursor = localStorage.getItem('cursor')
        if (cursor) root.dataset.cursor = cursor
      } catch (e) {}
    </script>
